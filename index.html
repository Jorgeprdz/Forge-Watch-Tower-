<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>Forge Watch Tower</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#202936;--text:#edf2f7;--muted:#8793a3;--ok:#58d68d;--warn:#f5b942;--fail:#ff6678;--unknown:#8290a3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#172130 0,#080b10 48%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:22px}.monitor{width:min(780px,100%);background:rgba(16,21,29,.92);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.42)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.readonly{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}.hero{text-align:center;padding:14px 0 30px}.label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}#status{font-size:clamp(58px,12vw,96px);font-weight:900;line-height:1;margin:10px 0 8px}.pass{color:var(--ok)}.warn{color:var(--warn)}.fail{color:var(--fail)}.unknown{color:var(--unknown)}#score{font-size:20px;font-weight:700}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.meta>div{background:#0b1017;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.meta span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.meta strong{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;overflow-wrap:anywhere}.sensors{border-top:1px solid var(--line);padding-top:16px}.sensor{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(32,41,54,.65)}.dot{width:10px;height:10px;border-radius:50%;background:var(--unknown);box-shadow:0 0 14px currentColor}.sensor b{font-size:14px}.sensor small{color:var(--muted);font-size:11px}.dot.pass{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}.dot.unknown{background:var(--unknown)}.terminal{margin-top:20px;background:#070a0f;border:1px solid var(--line);border-radius:16px;overflow:hidden}.terminal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line);background:#0b0f15}.terminal-title{font:700 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.terminal-live{font:600 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:var(--muted)}#terminal-log{margin:0;padding:15px;min-height:150px;max-height:250px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:500 11.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:#c8d1dc}.terminal-link{display:block;padding:0 15px 13px;font:600 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:var(--muted);text-decoration:none}.terminal-link:hover{color:var(--text)}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:18px;color:var(--muted);font-size:11px}@media(max-width:560px){.monitor{padding:20px;border-radius:20px}.meta{grid-template-columns:1fr}.sensor{grid-template-columns:14px 1fr}.sensor small{grid-column:2}.footer{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<main class="monitor" aria-live="polite">
<header><div class="brand">Forge Watch Tower</div><div class="readonly">READ ONLY</div></header>
<section class="hero"><div class="label">Forge Health</div><div id="status" class="unknown">CHECKING</div><div id="score">— / 100</div><div class="meta"><div><span>ForgeOS main</span><strong id="sha">resolviendo…</strong></div><div><span>Última lectura</span><strong id="time">—</strong></div></div></section>
<section class="sensors" id="sensors"></section>
<section class="terminal" aria-label="Watch Tower audit log">
  <div class="terminal-head"><span class="terminal-title">watchtower.log</span><span class="terminal-live">sanitized · read only</span></div>
  <pre id="terminal-log">$ watch forgeos/main --readonly\n[INFO] resolving current evidence…</pre>
  <a id="evidence-link" class="terminal-link" href="https://github.com/Jorgeprdz/ForgeOS/actions" target="_blank" rel="noopener">open evidence ↗</a>
</section>
<div class="footer"><span>Observe → Detect → Explain → Evidence</span><span>Auto refresh · 60 s</span></div>
</main>
<script>
const API='https://api.github.com/repos/Jorgeprdz/ForgeOS';
const PROSPECT_ACCEPTANCE='writable-synthetic-acceptance-005c.yml';
const sources=['AGENTS.md','FORGE_CONSTITUTION_V3.md','docs/00-governance/FORGE_ROBOCOP_DIRECTIVES.md','docs/00-governance/FORGE_GOVERNANCE_REGISTRY.md'];
const council=['Miranda','Nash','Joy Mangano','Arqui Juve','Jürgen Klaric','Jordan Belfort','Hitch','Patch Adams','Chris Gardner','Rocky','Mick','Nicky Spurgeon','Andrey'];
const aliases={'Joy Mangano':['Joy Mangano','Joy Mangano'],'Arqui Juve':['Arqui Juve','Arqui Juve'],'Jürgen Klaric':['Jürgen Klaric','Jurgen Klaric','Jürgen Klaric'],'Jordan Belfort':['Jordan Belfort','Jordan Belfort'],'Patch Adams':['Patch Adams','Patch Adams'],'Chris Gardner':['Chris Gardner','Chris Gardner'],'Nicky Spurgeon':['Nicky Spurgeon','Nicky Spurgeon']};
const labels={REPOSITORY_BOUNDARY:'Repository boundary',MAIN_SHA:'Main SHA',CANONICAL_SOURCES:'Canonical sources',COUNCIL_AUTHORITY:'Council authority',RECENT_CI:'Recent CI',PROSPECT_DATA_INTEGRITY:'Prospect data integrity'};
async function json(url){const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`${r.status}`);return r.json()}
async function text(url){const r=await fetch(url);if(!r.ok)throw new Error(`${r.status}`);return r.text()}
function setStatus(el,s){el.className=s.toLowerCase();el.textContent=s}
function worst(items){const rank={PASS:0,UNKNOWN:1,WARN:2,FAIL:3};return ['PASS','UNKNOWN','WARN','FAIL'][Math.max(...items.map(x=>rank[x.status]))]}
function score(items){const p={PASS:1,UNKNOWN:.5,WARN:.4,FAIL:0};return Math.round(100*items.reduce((a,x)=>a+p[x.status],0)/items.length)}
function render(findings){const root=document.getElementById('sensors');root.innerHTML='';for(const f of findings){const row=document.createElement('div'),dot=document.createElement('i'),name=document.createElement('b'),summary=document.createElement('small');row.className='sensor';dot.className=`dot ${f.status.toLowerCase()}`;name.textContent=labels[f.id];summary.textContent=f.summary;row.append(dot,name,summary);root.append(row)}const s=worst(findings);setStatus(document.getElementById('status'),s);document.getElementById('score').textContent=`${score(findings)} / 100`}
function line(status,message){return `[${status.padEnd(7)}] ${message}`}
function renderTerminal({sha,findings,acceptanceRun,acceptanceJob}){
 const out=['$ watch forgeos/main --readonly',line('TARGET',`main@${sha==='UNKNOWN'?'UNKNOWN':sha.slice(0,12)}`)];
 for(const f of findings){if(f.id==='MAIN_SHA')continue;out.push(line(f.status,`${labels[f.id].toLowerCase()} · ${f.summary}`))}
 if(acceptanceRun){
   out.push(line('005C',`run #${acceptanceRun.run_number} · ${acceptanceRun.status}${acceptanceRun.conclusion?`/${acceptanceRun.conclusion}`:''}`));
   if(acceptanceJob?.steps?.length){
     const failed=acceptanceJob.steps.find(s=>s.conclusion==='failure');
     const seal=acceptanceJob.steps.find(s=>/Seal dedicated acceptance identities/i.test(s.name));
     const rotation=acceptanceJob.steps.find(s=>/Verify one-run credentials invalid after seal/i.test(s.name));
     if(failed)out.push(line('FAIL',`step · ${failed.name}`));
     if(seal)out.push(line(seal.conclusion==='success'?'PASS':'WARN',`safety · acceptance identities ${seal.conclusion==='success'?'sealed':'seal uncertain'}`));
     if(rotation)out.push(line(rotation.conclusion==='success'?'PASS':'WARN',`credentials · ${rotation.conclusion==='success'?'invalid after seal':'rotation uncertain'}`));
   }
 }
 out.push(line('BOUND', 'no ForgeOS writes from Watch Tower'));
 document.getElementById('terminal-log').textContent=out.join('\n');
 const link=document.getElementById('evidence-link');if(acceptanceRun?.html_url){link.href=acceptanceRun.html_url;link.textContent=`open 005C run #${acceptanceRun.run_number} evidence ↗`}else{link.href='https://github.com/Jorgeprdz/ForgeOS/actions';link.textContent='open Actions evidence ↗'}
}
async function audit(){
 const f=[];let sha='UNKNOWN',all='',acceptanceRun=null,acceptanceJob=null;
 try{const repo=await json(API);f.push({id:'REPOSITORY_BOUNDARY',status:repo.default_branch==='main'?'PASS':'WARN',summary:`default: ${repo.default_branch}`})}catch{f.push({id:'REPOSITORY_BOUNDARY',status:'FAIL',summary:'unreachable'})}
 try{const c=await json(`${API}/commits/main`);sha=c.sha;f.push({id:'MAIN_SHA',status:'PASS',summary:sha.slice(0,12)})}catch{f.push({id:'MAIN_SHA',status:'FAIL',summary:'unresolved'})}
 let sourceFail=0,sourceWarn=0;
 for(const p of sources){try{all+='\n'+await text(`https://raw.githubusercontent.com/Jorgeprdz/ForgeOS/${sha==='UNKNOWN'?'main':sha}/${p}`)}catch(e){String(e).includes('404')?sourceFail++:sourceWarn++}}
 f.push({id:'CANONICAL_SOURCES',status:sourceFail?'FAIL':sourceWarn?'WARN':'PASS',summary:sourceFail?`${sourceFail} missing`:sourceWarn?`${sourceWarn} uncertain`:`${sources.length}/${sources.length}`});
 const missing=council.filter(n=>!(aliases[n]||[n]).some(a=>all.includes(a)));
 f.push({id:'COUNCIL_AUTHORITY',status:missing.length?'WARN':'PASS',summary:missing.length?`${missing.length} missing`:'13/13'});
 try{const runs=await json(`${API}/actions/runs?branch=main&per_page=1`);const r=runs.workflow_runs?.[0];if(!r)f.push({id:'RECENT_CI',status:'UNKNOWN',summary:'no runs'});else f.push({id:'RECENT_CI',status:r.status==='completed'&&r.conclusion==='success'?'PASS':'WARN',summary:r.status==='completed'?r.conclusion:r.status})}catch{f.push({id:'RECENT_CI',status:'UNKNOWN',summary:'unreadable'})}
 try{
   const runs=await json(`${API}/actions/workflows/${PROSPECT_ACCEPTANCE}/runs?per_page=1`);acceptanceRun=runs.workflow_runs?.[0]||null;
   const r=acceptanceRun;
   if(!r) f.push({id:'PROSPECT_DATA_INTEGRITY',status:'WARN',summary:'005C not run on current main'});
   else if(sha==='UNKNOWN') f.push({id:'PROSPECT_DATA_INTEGRITY',status:'UNKNOWN',summary:'main SHA unknown'});
   else if(r.head_sha!==sha) f.push({id:'PROSPECT_DATA_INTEGRITY',status:'WARN',summary:`stale 005C · ${String(r.head_sha||'unknown').slice(0,12)}`});
   else if(r.status!=='completed') f.push({id:'PROSPECT_DATA_INTEGRITY',status:'WARN',summary:`005C · ${r.status}`});
   else{
     if(r.id){try{const jobs=await json(`${API}/actions/runs/${r.id}/jobs?per_page=20`);acceptanceJob=jobs.jobs?.[0]||null}catch{}}
     const failed=acceptanceJob?.steps?.find(s=>s.conclusion==='failure');
     f.push({id:'PROSPECT_DATA_INTEGRITY',status:r.conclusion==='success'?'PASS':'FAIL',summary:r.conclusion==='success'?'005C current main · isolated A/B':failed?`005C failed · ${failed.name}`:`005C current main · ${r.conclusion||'failed'}`});
   }
 }catch{f.push({id:'PROSPECT_DATA_INTEGRITY',status:'UNKNOWN',summary:'005C acceptance unreadable'})}
 document.getElementById('sha').textContent=sha;document.getElementById('time').textContent=new Date().toLocaleString('es-MX');render(f);renderTerminal({sha,findings:f,acceptanceRun,acceptanceJob})
}
audit();setInterval(audit,60000);
</script>
</body>
</html>
